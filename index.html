<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AOSB Kargo Teslimat Paneli</title>
<style>
:root{--bg:#f1f3ec;--card:#fff;--ink:#17261d;--mute:#5d6b62;--acc:#0b7a3e;--hit:#e8431c;--ok:#1fa355;--pk:#2f6fe4;--line:#cfd6cb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a14;--card:#1b2a21;--ink:#e8efe9;--mute:#9db0a3;--acc:#4cc27f;--line:#2e4034}}
:root[data-theme="dark"]{--bg:#111a14;--card:#1b2a21;--ink:#e8efe9;--mute:#9db0a3;--acc:#4cc27f;--line:#2e4034}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.pn{flex:1;min-height:0;display:flex;flex-direction:column}[hidden]{display:none!important}
.sc{overflow-y:auto;padding:12px;flex:1}
header{padding:10px 12px 8px;background:var(--card);border-bottom:1px solid var(--line);z-index:3}
.row{display:flex;gap:8px;margin-bottom:8px}.row:last-child{margin-bottom:0}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;border:0;border-radius:10px;padding:0 14px;background:var(--acc);color:#fff;font-weight:600;min-height:40px}
button:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
.kseg button,nav button{flex:1;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.kseg button.on,nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kseg button.pk.on{background:var(--pk);border-color:var(--pk)}
nav{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
#res{display:flex;gap:8px;overflow-x:auto;padding-top:8px;scrollbar-width:none}#res:empty{display:none}
.chip{flex:0 0 auto;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:6px 12px;font-weight:400}
.chip b{display:block;font-size:17px}.chip span{font-size:12.5px;color:var(--mute)}.chip.on{border-color:var(--hit)}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#2b3a2c}
#w{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff}
#w img{position:absolute;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
#mk{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mk{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--hit);color:#fff;border:3px solid #fff;font:700 14px/24px system-ui,sans-serif;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.55)}
.mk.pk{background:var(--pk)}.mk.dn{background:var(--ok)}
#pin{position:absolute;left:0;top:0;width:44px;height:44px;border:4px solid var(--hit);border-radius:50%;background:rgba(232,67,28,.18);display:none;pointer-events:none;box-shadow:0 0 0 3px #fff}
#pin.show{display:block;animation:p 1.3s ease-out 3}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(255,255,255,.55)}}
@media (prefers-reduced-motion:reduce){#pin.show{animation:none}}
#pop{position:absolute;left:8px;right:8px;bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-height:46%;overflow-y:auto;display:none;touch-action:pan-y;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.35)}#pop.show{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pc{background:transparent;color:var(--ink);border:1px solid var(--line);width:36px;padding:0;min-height:34px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pr button{padding:6px 14px;min-height:38px;background:var(--ok)}.pr button.r,.bt .h,.bt .r,.bt .x,.bt .e,.bt .p{background:transparent;color:var(--ink);border:1px solid var(--line)}
#info,#pb{position:absolute;left:10px;right:56px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;display:none;z-index:4}
#info.show{display:block}#pb.show{display:flex;gap:8px;align-items:center;justify-content:space-between;right:10px;flex-wrap:wrap}
#pb button{min-height:36px;padding:0 12px}#pb .r{background:transparent;color:var(--ink);border:1px solid var(--line)}#pb button:disabled{opacity:.45}
.zb{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zb button{width:40px;height:40px;padding:0;font-size:22px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.card{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.card.dn{border-color:var(--ok);background:rgba(31,163,85,.15)}.card small{color:var(--mute);display:block}
.tg{background:var(--pk);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;margin-left:6px;font-weight:600}
.bt{display:flex;flex-direction:column;gap:6px}.bt button{padding:6px 12px;font-size:14px;min-height:34px}.bt .s{background:var(--ok)}
#fe{color:var(--hit);font-size:14px;min-height:1.2em}
h2,h3{margin:14px 0 6px}h2{font-size:21px}h3{font-size:16px}
.kp{display:flex;gap:10px}.kp div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.kp b{font-size:26px;display:block}.kp span{color:var(--mute);font-size:14px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--ok);font-weight:700}.mu{color:var(--mute)}
#end{width:100%;margin-top:14px;min-height:46px;background:var(--hit)}
</style></head><body>
