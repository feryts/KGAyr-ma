<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kolay Gelsin - Ayristirma</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #f0f4f0;
    --surface: #ffffff;
    --border: #e0e8e0;
    --kg-green: #00A651;
    --kg-green-dark: #008f45;
    --kg-green-light: #e6f7ee;
    --text: #1a1a1a;
    --muted: #888;
    --success-bg: #edfaf3;
    --error-bg: #fff5f5;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.10);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  /* ── HEADER ── */
  .header {
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
    padding: 14px 18px;
    background: var(--kg-green);
    border-radius: 18px;
    box-shadow: 0 4px 16px rgba(0,166,81,0.25);
  }

  .brand { display:flex; align-items:center; gap:12px; }
  .brand-text { display:flex; flex-direction:column; gap:1px; }
  .brand-name { font-size:17px; font-weight:800; color:#fff; letter-spacing:-0.3px; line-height:1; }
  .brand-sub  { font-size:10px; font-weight:500; color:rgba(255,255,255,0.75); letter-spacing:0.08em; text-transform:uppercase; }

  .user-badge { font-size:12px; font-weight:600; color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:8px; }
  .logout-btn {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; border-radius:8px; padding:5px 12px; font-size:12px;
    font-weight:600; cursor:pointer; font-family:inherit; transition:all 0.2s;
  }
  .logout-btn:hover { background:rgba(255,255,255,0.35); }

  /* ── PAGES ── */
  .page { width:100%; max-width:480px; display:none; flex-direction:column; align-items:center; }
  .page.active { display:flex; }

  /* ── CARD ── */
  .card {
    width:100%; background:var(--surface);
    border:1px solid var(--border); border-radius:20px;
    padding:22px; margin-bottom:14px;
    box-shadow:var(--shadow);
    position: relative; overflow: hidden;
  }

  /* Arka planda şeffaf büyük logo */
  .card-bg-logo {
    position: absolute;
    right: -20px; bottom: -20px;
    width: 160px; height: 160px;
    opacity: 0.05;
    pointer-events: none;
  }

  .card-label {
    font-size:11px; font-weight:700; letter-spacing:0.08em;
    color:var(--kg-green); text-transform:uppercase; margin-bottom:16px;
    display:flex; align-items:center; gap:6px;
  }
  .card-label::before {
    content:''; display:inline-block;
    width:3px; height:14px; background:var(--kg-green); border-radius:2px;
  }

  /* ── LOGIN ── */
  .login-header { text-align:center; margin-bottom:28px; position:relative; z-index:1; }
  .login-logo-wrap {
    width:72px; height:72px; background:var(--kg-green);
    border-radius:20px; display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px; box-shadow:0 6px 20px rgba(0,166,81,0.35);
  }
  .login-logo-wrap svg { width:44px; height:44px; }
  .login-title { font-size:22px; font-weight:800; color:var(--text); margin-bottom:4px; }
  .login-sub { font-size:13px; color:var(--muted); }

  .field { margin-bottom:12px; position:relative; z-index:1; }
  .field label { display:block; font-size:12px; font-weight:600; color:var(--text); margin-bottom:6px; }
  .field input {
    width:100%; background:#fafafa; border:1.5px solid var(--border);
    border-radius:12px; padding:13px 16px; color:var(--text);
    font-family:inherit; font-size:14px; outline:none; transition:all 0.2s;
  }
  .field input:focus { border-color:var(--kg-green); background:#fff; box-shadow:0 0 0 3px rgba(0,166,81,0.1); }

  .btn-primary {
    width:100%; background:var(--kg-green); color:#fff;
    border:none; border-radius:14px; padding:15px;
    font-family:inherit; font-weight:700; font-size:15px;
    cursor:pointer; transition:all 0.2s; margin-top:8px;
    position:relative; overflow:hidden; z-index:1;
    box-shadow:0 4px 14px rgba(0,166,81,0.35);
  }
  .btn-primary:hover { background:var(--kg-green-dark); transform:translateY(-1px); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-primary.loading::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
    animation:shimmer 1s infinite;
  }
  @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

  .login-err {
    margin-top:10px; padding:10px 14px;
    background:var(--error-bg); border:1px solid #ffc0c0;
    border-radius:10px; font-size:13px; color:#d00; display:none; font-weight:500;
    position:relative; z-index:1;
  }
  .login-err.show { display:block; }

  /* ── BTN GROUP ── */
  .btn-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; position:relative; z-index:1; }
  .btn-outline {
    background:#fafafa; border:1.5px solid var(--border);
    color:var(--text); border-radius:12px; padding:12px 8px;
    font-family:inherit; font-weight:600; font-size:13px;
    cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-outline:hover { border-color:var(--kg-green); color:var(--kg-green); background:var(--kg-green-light); }
  .btn-outline.active { background:var(--kg-green); color:#fff; border-color:var(--kg-green); }

  /* ── KAMERA AYARI ── */
  .pref-row {
    display:none; align-items:center; gap:10px;
    margin-bottom:14px; cursor:pointer;
    padding:11px 14px; background:#fafafa;
    border-radius:12px; border:1.5px solid var(--border);
    transition:border-color 0.2s; position:relative; z-index:1;
  }
  .pref-row:hover { border-color:var(--kg-green); }
  .pref-row input[type=checkbox] { width:18px; height:18px; accent-color:var(--kg-green); cursor:pointer; flex-shrink:0; }
  .pref-row span { font-size:13px; font-weight:500; color:var(--text); }

  /* ── KAMERA ── */
  .camera-section {
    display:none; margin-bottom:14px; position:relative;
    border-radius:14px; overflow:hidden; background:#000; z-index:1;
  }
  .camera-section.open { display:block; }
  #cameraVideo { width:100%; display:block; max-height:240px; object-fit:cover; }
  .camera-overlay { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; }
  .scan-frame { width:200px; height:100px; position:relative; }
  .scan-frame::before,.scan-frame::after { content:''; position:absolute; width:22px; height:22px; border-color:#00A651; border-style:solid; }
  .scan-frame::before { top:0; left:0; border-width:3px 0 0 3px; border-radius:3px 0 0 0; }
  .scan-frame::after  { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 3px 0; }
  .corner-tr { position:absolute; top:0; right:0; width:22px; height:22px; border-top:3px solid #00A651; border-right:3px solid #00A651; border-radius:0 3px 0 0; }
  .corner-bl { position:absolute; bottom:0; left:0; width:22px; height:22px; border-bottom:3px solid #00A651; border-left:3px solid #00A651; border-radius:0 0 0 3px; }
  .scan-line { position:absolute; left:4px; right:4px; height:2px; background:linear-gradient(90deg,transparent,#00A651,transparent); animation:scanMove 2s ease-in-out infinite; }
  @keyframes scanMove { 0%,100%{top:8%} 50%{top:88%} }
  .camera-status { position:absolute; bottom:0; left:0; right:0; text-align:center; font-size:12px; font-weight:500; color:#fff; background:rgba(0,0,0,0.6); padding:6px; }

  /* ── RESİM YÜKLEME ── */
  .img-upload-area {
    display:none; margin-bottom:14px;
    border:2px dashed var(--border); border-radius:14px;
    padding:22px; text-align:center; cursor:pointer;
    transition:all 0.2s; background:#fafafa; position:relative; z-index:1;
  }
  .img-upload-area.open { display:block; }
  .img-upload-area:hover { border-color:var(--kg-green); background:var(--kg-green-light); }
  .img-upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .img-upload-icon { font-size:28px; margin-bottom:8px; }
  .img-upload-text { font-size:13px; color:var(--muted); font-weight:500; }
  .img-upload-text strong { color:var(--kg-green); }
  .img-preview { margin-top:10px; border-radius:8px; max-width:100%; max-height:180px; display:none; }
  .img-scanning { font-size:12px; font-weight:600; margin-top:8px; display:none; }

  /* ── BARKOD ── */
  .barcode-wrap { position:relative; margin-bottom:12px; z-index:1; }
  .barcode-input {
    width:100%; background:#fafafa; border:1.5px solid var(--border);
    border-radius:12px; padding:15px 18px; color:var(--text);
    font-family:inherit; font-size:14px; font-weight:500;
    outline:none; transition:all 0.2s;
  }
  .barcode-input:focus { border-color:var(--kg-green); background:#fff; box-shadow:0 0 0 3px rgba(0,166,81,0.1); }
  .barcode-input::placeholder { color:var(--muted); font-weight:400; }

  .btn-send {
    width:100%; background:var(--kg-green); color:#fff;
    border:none; border-radius:14px; padding:15px;
    font-family:inherit; font-weight:700; font-size:15px;
    cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; z-index:1;
    box-shadow:0 4px 14px rgba(0,166,81,0.3);
  }
  .btn-send:hover { background:var(--kg-green-dark); transform:translateY(-1px); }
  .btn-send:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-send.loading::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); animation:shimmer 1s infinite; }

  /* ── RESULT ── */
  .result { margin-top:12px; border-radius:12px; padding:14px 16px; display:none; animation:fadeIn 0.3s ease; position:relative; z-index:1; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  .result.success { display:block; background:var(--success-bg); border:1.5px solid #9de8c0; }
  .result.error   { display:block; background:var(--error-bg); border:1.5px solid #ffc0c0; }
  .result-title { font-size:13px; font-weight:700; margin-bottom:5px; }
  .result.success .result-title { color:var(--kg-green); }
  .result.error   .result-title { color:#d00; }
  .result-body { font-size:13px; color:var(--text); line-height:1.6; }
  .result-barcode { font-size:11px; color:var(--muted); margin-top:4px; word-break:break-all; }

  /* ── STATS ── */
  .stats { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-box {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:14px 10px; text-align:center;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat-num { font-size:28px; font-weight:800; line-height:1; margin-bottom:4px; color:var(--kg-green); }
  .stat-box:nth-child(3) .stat-num { color:#d00; }
  .stat-box:nth-child(1) .stat-num { color:var(--text); }
  .stat-label { font-size:10px; font-weight:600; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase; }

  /* ── LOG ── */
  .log-section { width:100%; }
  .log-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .log-title { font-size:12px; font-weight:700; color:var(--text); text-transform:uppercase; letter-spacing:0.06em; }
  .log-count { display:inline-block; background:var(--kg-green); color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; margin-left:6px; }
  .log-expire { font-size:11px; color:var(--muted); font-weight:500; }
  .log-clear { font-size:12px; font-weight:600; color:var(--muted); background:none; border:none; cursor:pointer; font-family:inherit; transition:color 0.2s; }
  .log-clear:hover { color:#d00; }
  .log-list { display:flex; flex-direction:column; gap:8px; max-height:400px; overflow-y:auto; }
  .log-list::-webkit-scrollbar { width:3px; }
  .log-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .log-item {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    animation:fadeIn 0.2s ease; box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .log-item.ok   { border-left:4px solid var(--kg-green); }
  .log-item.fail { border-left:4px solid #d00; }
  .log-barcode { font-size:12px; font-weight:500; color:var(--text); word-break:break-all; flex:1; line-height:1.5; }
  .log-num { font-size:10px; color:var(--muted); font-weight:400; margin-right:4px; }
  .log-meta { text-align:right; flex-shrink:0; }
  .log-badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; display:block; margin-bottom:4px; }
  .log-item.ok   .log-badge { background:rgba(0,166,81,0.12); color:var(--kg-green); }
  .log-item.fail .log-badge { background:rgba(200,0,0,0.1); color:#d00; }
  .log-time { font-size:10px; color:var(--muted); font-weight:500; }
  .empty-log { text-align:center; padding:28px; color:var(--muted); font-size:13px; font-weight:500; background:var(--surface); border:1.5px dashed var(--border); border-radius:14px; }

  .flash { position:fixed; inset:0; background:rgba(0,166,81,0.1); pointer-events:none; z-index:999; opacity:0; transition:opacity 0.1s; }
  .flash.show { opacity:1; }
</style>
</head>
<body>

<div class="flash" id="flashEl"></div>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <!-- Kolay Gelsin SVG Logo -->
    <svg width="38" height="38" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" rx="24" fill="white"/>
      <path d="M60 18C42.33 18 28 32.33 28 50c0 26.25 32 52 32 52s32-25.75 32-52C92 32.33 77.67 18 60 18zm0 46c-7.73 0-14-6.27-14-14s6.27-14 14-14 14 6.27 14 14-6.27 14-14 14z" fill="#00A651"/>
    </svg>
    <div class="brand-text">
      <div class="brand-name">Kolay Gelsin</div>
      <div class="brand-sub">Ayrıştırma Paneli</div>
    </div>
  </div>
  <div class="user-badge">
    <span id="userLabel" style="display:none"></span>
    <button class="logout-btn" id="logoutBtn" style="display:none" onclick="logout()">Çıkış</button>
  </div>
</div>

<!-- LOGIN -->
<div class="page active" id="loginPage">
  <div class="card">
    <!-- Arka plan şeffaf büyük logo -->
    <svg class="card-bg-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 18C42.33 18 28 32.33 28 50c0 26.25 32 52 32 52s32-25.75 32-52C92 32.33 77.67 18 60 18zm0 46c-7.73 0-14-6.27-14-14s6.27-14 14-14 14 6.27 14 14-6.27 14-14 14z" fill="#00A651"/>
    </svg>

    <div class="login-header">
      <div class="login-logo-wrap">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M60 10C38.46 10 21 27.46 21 49c0 30.19 39 61 39 61s39-30.81 39-61C99 27.46 81.54 10 60 10zm0 53c-8.84 0-16-7.16-16-16s7.16-16 16-16 16 7.16 16 16-7.16 16-16 16z" fill="white"/>
        </svg>
      </div>
      <div class="login-title">Kolay Gelsin</div>
      <div class="login-sub">Hesabınızla giriş yapın</div>
    </div>
    <div class="field">
      <label>Kullanıcı Adı</label>
      <input type="text" id="loginUser" placeholder="kullanıcı adı" autocomplete="username" />
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Giriş Yap</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ANA SAYFA -->
<div class="page" id="mainPage">
  <div class="card">
    <!-- Arka plan şeffaf büyük logo -->
    <svg class="card-bg-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 18C42.33 18 28 32.33 28 50c0 26.25 32 52 32 52s32-25.75 32-52C92 32.33 77.67 18 60 18zm0 46c-7.73 0-14-6.27-14-14s6.27-14 14-14 14 6.27 14 14-6.27 14-14 14z" fill="#00A651"/>
    </svg>

    <div class="card-label">Barkod Ayrıştır</div>

    <div class="btn-group">
      <button class="btn-outline" id="cameraToggleBtn" onclick="toggleCamera()">📷 Kamera</button>
      <button class="btn-outline" id="imgToggleBtn" onclick="toggleImgUpload()">🖼 Resimden Oku</button>
    </div>

    <label class="pref-row" id="cameraKeepOpenWrap">
      <input type="checkbox" id="cameraKeepOpen" onchange="saveCameraPreference()" />
      <span>Her okumadan sonra kamera açık kalsın</span>
    </label>

    <div class="camera-section" id="cameraSection">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-overlay">
        <div class="scan-frame">
          <div class="corner-tr"></div>
          <div class="corner-bl"></div>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="camera-status" id="cameraStatus">Barkodu çerçeveye getirin...</div>
    </div>

    <div class="img-upload-area" id="imgUploadArea">
      <input type="file" id="imgFileInput" accept="image/*" onchange="handleImageFile(event)" />
      <div class="img-upload-icon">📸</div>
      <div class="img-upload-text">Barkod içeren resmi seçin<br><strong>Ekran görüntüsü de olabilir</strong></div>
      <img id="imgPreview" class="img-preview" />
      <div class="img-scanning" id="imgScanning"></div>
    </div>

    <div class="barcode-wrap">
      <input type="text" class="barcode-input" id="barcodeInput" placeholder="Barkod numarası girin veya okutun..." autocomplete="off" />
    </div>
    <button class="btn-send" id="sendBtn" onclick="sendBarcode()">Ayrıştır</button>

    <div class="result" id="result">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-body" id="resultBody"></div>
      <div class="result-barcode" id="resultBarcode"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Toplam</div></div>
    <div class="stat-box"><div class="stat-num" id="statOk">0</div><div class="stat-label">Basarili</div></div>
    <div class="stat-box"><div class="stat-num" id="statFail">0</div><div class="stat-label">Hatali</div></div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <div class="log-title">Islem Listesi <span class="log-count" id="logCount">0</span></div>
      <span class="log-expire" id="logExpire"></span>
      <button class="log-clear" onclick="clearLog()">Temizle</button>
    </div>
    <div class="log-list" id="logList">
      <div class="empty-log">Henüz işlem yapılmadı</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script>
  const LOG_KEY = 'kg_log';
  const LOG_TTL = 24 * 60 * 60 * 1000; // 24 saat

  let token = localStorage.getItem('kg_token') || '';
  let savedUser = localStorage.getItem('kg_user') || '';
  let stats = { total:0, ok:0, fail:0 };
  let logItems = [];
  let cameraKeepOpenPref = localStorage.getItem('kg_cam_keep') === '1';
  let cameraOpen = false;
  let imgUploadOpen = false;
  let codeReader = null;
  let scanCooldown = false;

  // 24 saat geçmemiş logları yükle
  function loadLog() {
    try {
      const raw = localStorage.getItem(LOG_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      const now = Date.now();
      // 24 saatten eski kayıtları at
      logItems = saved.filter(item => (now - item.ts) < LOG_TTL);
      // Stats hesapla
      stats = { total: logItems.length, ok: logItems.filter(i=>i.status==='ok').length, fail: logItems.filter(i=>i.status==='fail').length };
      saveLog();
    } catch(e) { logItems = []; }
  }

  function saveLog() {
    localStorage.setItem(LOG_KEY, JSON.stringify(logItems));
  }

  function updateExpireInfo() {
    if (!logItems.length) { document.getElementById('logExpire').textContent = ''; return; }
    const oldest = logItems[logItems.length-1];
    const remaining = LOG_TTL - (Date.now() - oldest.ts);
    const hours = Math.floor(remaining / 3600000);
    const mins = Math.floor((remaining % 3600000) / 60000);
    document.getElementById('logExpire').textContent = `${hours}s ${mins}d sonra silinir`;
  }

  if (token) { loadLog(); showMain(savedUser); }

  document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  document.getElementById('barcodeInput').addEventListener('keydown', e => { if (e.key==='Enter') sendBarcode(); });

  /* ── LOGIN ── */
  async function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    if (!user || !pass) { showLoginErr('Kullanıcı adı ve şifre gerekli.'); return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.classList.add('loading'); btn.textContent = 'GİRİŞ YAPILIYOR...';

    try {
      const res = await fetch('/api/proxy?endpoint=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userName: user, password: pass, grant_type: 'password', channel: '1', CaptchaToken: '', VerificationCode: '', CustomerType: 'null' })
      });
      const data = await res.json();
      const tk = data.access_token || data.token || data.Token || data.data?.access_token;
      if (tk) {
        token = tk;
        localStorage.setItem('kg_token', token);
        localStorage.setItem('kg_user', user);
        loadLog();
        showMain(user);
      } else {
        showLoginErr(data.message || data.Message || data.error_description || 'Giriş başarısız.');
      }
    } catch (err) {
      showLoginErr('Bağlantı hatası: ' + err.message);
    }

    btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'GİRİŞ YAP';
  }

  function showLoginErr(msg) {
    const el = document.getElementById('loginErr');
    el.textContent = msg; el.classList.add('show');
  }

  function showMain(user) {
    document.getElementById('loginPage').classList.remove('active');
    document.getElementById('mainPage').classList.add('active');
    document.getElementById('userLabel').textContent = user;
    document.getElementById('userLabel').style.display = 'inline';
    document.getElementById('logoutBtn').style.display = 'inline';
    updateStats(); renderLog();
    setTimeout(() => document.getElementById('barcodeInput').focus(), 100);
  }

  function logout() {
    token = '';
    localStorage.removeItem('kg_token');
    localStorage.removeItem('kg_user');
    // LOGU SILME — 24 saat kalacak
    stopCamera();
    document.getElementById('mainPage').classList.remove('active');
    document.getElementById('loginPage').classList.add('active');
    document.getElementById('userLabel').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('loginErr').classList.remove('show');
  }

  function saveCameraPreference() {
    cameraKeepOpenPref = document.getElementById('cameraKeepOpen').checked;
    localStorage.setItem('kg_cam_keep', cameraKeepOpenPref ? '1' : '0');
  }

  /* ── KAMERA ── */
  async function toggleCamera() {
    if (imgUploadOpen) toggleImgUpload(); // diğerini kapat
    if (!cameraOpen) {
      try {
        if (typeof ZXing === 'undefined') { alert('Kütüphane yüklenemedi, sayfayı yenileyin.'); return; }
        codeReader = new ZXing.BrowserMultiFormatReader();
        const devices = await codeReader.listVideoInputDevices();
        let deviceId = devices[0]?.deviceId;
        const back = devices.find(d => /back|rear|environment/i.test(d.label));
        if (back) deviceId = back.deviceId;

        document.getElementById('cameraSection').classList.add('open');
        document.getElementById('cameraToggleBtn').classList.add('active');
        document.getElementById('cameraToggleBtn').textContent = '⏹ Kapat';
        document.getElementById('cameraKeepOpenWrap').style.display = 'flex';
        document.getElementById('cameraKeepOpen').checked = cameraKeepOpenPref;
        cameraOpen = true;

        await codeReader.decodeFromVideoDevice(deviceId, 'cameraVideo', (result, err) => {
          if (result && !scanCooldown) {
            const barcode = result.getText();
            document.getElementById('cameraStatus').textContent = '✓ Okundu!';
            flashScreen();
            document.getElementById('barcodeInput').value = barcode;
            scanCooldown = true;
            sendBarcode();
            setTimeout(() => {
              scanCooldown = false;
              document.getElementById('cameraStatus').textContent = 'Barkodu çerçeveye getirin...';
            }, 2500);
          }
        });
      } catch (err) {
        alert('Kamera açılamadı: ' + err.message);
        cameraOpen = false;
      }
    } else {
      stopCamera();
    }
  }

  function stopCamera() {
    if (codeReader) { codeReader.reset(); codeReader = null; }
    document.getElementById('cameraSection').classList.remove('open');
    document.getElementById('cameraToggleBtn').classList.remove('active');
    document.getElementById('cameraToggleBtn').textContent = '📷 Kamera';
    document.getElementById('cameraKeepOpenWrap').style.display = 'none';
    cameraOpen = false;
  }

  /* ── RESİMDEN OKUMA ── */
  function toggleImgUpload() {
    if (cameraOpen) stopCamera(); // diğerini kapat
    imgUploadOpen = !imgUploadOpen;
    const area = document.getElementById('imgUploadArea');
    const btn = document.getElementById('imgToggleBtn');
    if (imgUploadOpen) {
      area.classList.add('open');
      btn.classList.add('active');
      btn.textContent = '✕ Kapat';
    } else {
      area.classList.remove('open');
      btn.classList.remove('active');
      btn.textContent = '🖼️ Resimden Oku';
      document.getElementById('imgPreview').style.display = 'none';
      document.getElementById('imgScanning').style.display = 'none';
    }
  }

  async function handleImageFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    // Önizleme göster
    const preview = document.getElementById('imgPreview');
    const scanning = document.getElementById('imgScanning');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    scanning.style.display = 'block';
    scanning.textContent = '⏳ Barkod taranıyor...';

    try {
      if (typeof ZXing === 'undefined') { scanning.textContent = '✗ Kütüphane yüklenemedi.'; return; }
      const reader = new ZXing.BrowserMultiFormatReader();
      const img = new Image();
      img.src = preview.src;
      await new Promise(r => img.onload = r);

      const result = await reader.decodeFromImageElement(img);
      const barcode = result.getText();

      scanning.textContent = '✓ Barkod bulundu: ' + barcode.slice(0,20) + (barcode.length>20?'...':'');
      scanning.style.color = '#00a87a';
      flashScreen();
      document.getElementById('barcodeInput').value = barcode;
      sendBarcode();

    } catch (err) {
      scanning.textContent = '✗ Barkod bulunamadı. Daha net bir resim deneyin.';
      scanning.style.color = '#e85d2f';
    }

    // Input'u sıfırla (aynı resmi tekrar seçebilsin)
    event.target.value = '';
  }

  function flashScreen() {
    const el = document.getElementById('flashEl');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 180);
  }

  /* ── AYRIŞTIRMA ── */
  async function sendBarcode() {
    const barcode = document.getElementById('barcodeInput').value.trim();
    if (!barcode) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.classList.add('loading'); btn.textContent = 'GÖNDERİLİYOR...';

    try {
      const res = await fetch('/api/proxy?endpoint=sort', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'bearer ' + token },
        body: JSON.stringify({
          ShipmentItemId: barcode, SortingLevelId: 2,
          ForceUnload: true, IsRemoveGroup: false, LoadShipmentItemToCourierVehicle: false
        })
      });

      if (res.status === 401) {
        showResult('error', '✗ OTURUM SONA ERDİ', 'Tekrar giriş yapılıyor...', barcode);
        setTimeout(() => logout(), 1500);
        return;
      }

      const data = await res.json();
      if (res.ok) {
        const msg = data.message || data.Message || data.data?.message || 'Ayrıştırma başarılı';
        showResult('success', '✓ AYRIŞTIRMA TAMAM', msg, barcode);
        addLog('ok', barcode);
      } else {
        const errMsg = data.message || data.Message || data.error || JSON.stringify(data);
        showResult('error', '✗ HATA', errMsg, barcode);
        addLog('fail', barcode, errMsg);
      }
    } catch (err) {
      showResult('error', '✗ BAĞLANTI HATASI', 'Sunucuya ulaşılamadı: ' + err.message, barcode);
      addLog('fail', barcode, err.message);
    }

    btn.disabled = false; btn.classList.remove('loading'); btn.textContent = 'AYRIŞTIR';
    document.getElementById('barcodeInput').value = '';
    // Kamera tercihe göre kapat veya aç tut
    if (cameraOpen && !cameraKeepOpenPref) {
      stopCamera();
    } else {
      document.getElementById('barcodeInput').focus();
    }
  }

  function showResult(type, title, body, barcode) {
    const el = document.getElementById('result');
    el.className = 'result ' + type;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultBody').textContent = body;
    document.getElementById('resultBarcode').textContent = 'Barkod: ' + barcode;
  }

  function addLog(status, barcode, errMsg) {
    stats.total++; if (status==='ok') stats.ok++; else stats.fail++;
    const now = new Date();
    logItems.unshift({
      status, barcode, errMsg,
      time: now.toLocaleTimeString('tr-TR'),
      date: now.toLocaleDateString('tr-TR'),
      ts: Date.now()
    });
    saveLog();
    updateStats();
    renderLog();
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statOk').textContent = stats.ok;
    document.getElementById('statFail').textContent = stats.fail;
    document.getElementById('logCount').textContent = stats.total;
    updateExpireInfo();
  }

  function renderLog() {
    const list = document.getElementById('logList');
    if (!logItems.length) { list.innerHTML = '<div class="empty-log">Henüz işlem yapılmadı</div>'; return; }
    list.innerHTML = logItems.map((item, i) => `
      <div class="log-item ${item.status}">
        <div class="log-barcode">
          <span class="log-num">#${stats.total - i}</span>
          ${item.barcode}
          ${item.errMsg ? '<br><span style="color:#e85d2f;font-size:10px">'+item.errMsg+'</span>' : ''}
        </div>
        <div class="log-meta">
          <span class="log-badge">${item.status==='ok'?'TAMAM':'HATA'}</span>
          <span class="log-time">${item.date}<br>${item.time}</span>
        </div>
      </div>`).join('');
    updateExpireInfo();
  }

  function clearLog() {
    if (!confirm('Tüm işlem listesi silinsin mi?')) return;
    logItems = []; stats = {total:0,ok:0,fail:0};
    localStorage.removeItem(LOG_KEY);
    updateStats(); renderLog();
    document.getElementById('result').className = 'result';
  }
</script>
</body>
</html>
